<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Vélib - RMI Map</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script type="module" src="../js/restaurantmap.js"></script>
</head>

<body>

    <nav-bar></nav-bar>

    <main>
        <div id="map"></div>
    </main>

    <div id="reservationModal" class="reservation-modal hidden">
        <div class="reservation-box">
            <h2>{{nomResto}}</h2>

            <input id="resName" placeholder="Nom" />
            <input id="resPrenom" placeholder="Prenom" />
            <input id="resPeople" type="number" placeholder="Personnes" />
            <input id="resTel" type="tel" placeholder="Telephones" />
            <input id="resDate" type="datetime-local" />

            <button id="confirmRes">Confirmer</button>
            <button id="cancelRes">Annuler</button>
        </div>
    </div>
    <div id="sidebar">
        <h3>Réservations</h3>
        <select id="restoSelect">
            <option value="-1">Toutes les réservations</option>
        </select>
        <ul id=listeReservation>

        </ul>
    </div>

    <div id="sidebar-toggle">❮</div>

</body>

</html>
