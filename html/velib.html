<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Vélib - RMI Map</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script type="module" src="../js/index.js"></script>
<script type="module" src="../js/velomap.js"></script>
</head>

<body>

    <nav-bar></nav-bar>

<main>
    <div style="padding: 1rem 0 0.5rem; display: flex; align-items: center; gap: 1rem;">
        <label for="ville-select" style="font-weight: 600; font-family: system-ui, sans-serif;">
            Ville :
        </label>
<select id="ville-select" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #d1d5db; font-size: 1rem; font-family: system-ui, sans-serif; background: white; cursor: pointer;">
    <!-- France -->
    <option value="amiens">Amiens</option>
    <option value="besancon">Besançon</option>
    <option value="lyon">Lyon</option>
    <option value="mulhouse">Mulhouse</option>
    <option value="nancy">Nancy</option>
    <option value="nantes">Nantes</option>
    <option value="rouen">Rouen</option>
    <option value="toulouse">Toulouse</option>
    
    <!-- International -->
    <option value="bruxelles">Bruxelles (Belgique)</option>
    <option value="dublin">Dublin (Irlande)</option>
    <option value="ljubljana">Ljubljana (Slovénie)</option>
    <option value="luxembourg">Luxembourg (Luxembourg)</option>
    <option value="namur">Namur (Belgique)</option>
    <option value="santander">Santander (Espagne)</option>
    <option value="seville">Séville (Espagne)</option>
    <option value="toyama">Toyama (Japon)</option>
    <option value="valence">Valence (Espagne)</option>
</select>
    </div>
    <div id="map"></div>
</main>
</body>

</html>
